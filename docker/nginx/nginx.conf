# Load balancer in front of the app replicas (profile "app").
events {}

http {
  # Docker's embedded DNS: re-resolve "app" so replicas that restart (new IPs) keep receiving traffic.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream wagering {
    zone wagering 64k;
    server app:3000 resolve;
    # Reuse upstream connections instead of a TCP handshake per request.
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://wagering;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # A replica that is down, draining (503) or crashed mid-request is skipped. Retrying a POST
      # is safe here because every submission is idempotent by its Idempotency-Key.
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 2s;
    }
  }
}
