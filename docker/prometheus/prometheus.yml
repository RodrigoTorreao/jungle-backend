# Profile "observability". Every app replica is discovered through Docker's DNS (one A record per
# replica of the "app" service), so scaling the cluster needs no config change.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: wagering
    metrics_path: /metrics
    dns_sd_configs:
      - names: [app]
        type: A
        port: 3000
        refresh_interval: 5s
