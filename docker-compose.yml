name: jungle-wagering

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300", "-c", "log_lock_waits=on"]
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name wagering-events.fifo >/dev/null 2>&1",
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  # --- The service: `docker compose up -d --build --wait` (migrations, 3 replicas, nginx :8080) --

  migrate:
    build: .
    command: ["bun", "scripts/migrate.ts", "up"]
    environment:
      MIGRATION_DATABASE_URL: postgres://wallet_owner:wallet_owner@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    deploy:
      replicas: 3
    environment: &app-env
      NODE_ENV: production
      LOG_LEVEL: info
      APP_ROLES: all
      DATABASE_URL: postgres://wallet_app:wallet_app@postgres:5432/wagering
      DATABASE_POOL_MAX: "10"
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SHUTDOWN_GRACE_MS: "20000"
      # `AUTH_MODE=keycloak docker compose --profile auth up` turns tokens on.
      # Tokens say iss=localhost:8180 (how clients reach Keycloak); keys come over the network.
      AUTH_MODE: ${AUTH_MODE:-disabled}
      OIDC_ISSUER: http://localhost:8180/realms/wagering
      OIDC_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
      # Tracing is opt-in: OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 (profile observability).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: wagering
      # Sample 10% of traces (parent-based: a trace is kept or dropped whole). Tracing every
      # request at saturation overflowed the span queue (whole HTTP spans lost) and cut the
      # throughput by a third (DECISION_LOG DL-029). Override for debugging.
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_BSP_MAX_QUEUE_SIZE: "8192"
    # Longer than SHUTDOWN_GRACE_MS: SIGTERM drains in-flight work before Docker's SIGKILL.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  # --- Identity provider: `--profile auth` (ARCHITECTURE §11) ----------------------------------

  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.3.0
    command: ["start-dev", "--import-realm"]
    environment:
      # Development only: admin console at http://localhost:8180 (admin/admin).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer for every caller, whether it reaches Keycloak as localhost:8180 or keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: plain HTTP over bash's /dev/tcp to the management port.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # --- Metrics, dashboard and traces: `--profile observability` ---------------------------------

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wagering.json
    ports:
      - "3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.5.0
    ports:
      - "16686:16686" # UI
      - "4318:4318" # OTLP/HTTP

  # --- Load generator inside the Compose network: `--profile load run --rm loadgen` -------------

  loadgen:
    profiles: [load]
    build: .
    command: ["bun", "load/run.ts"]
    environment:
      LOAD_TARGET_URL: http://lb:8080
      LOAD_DATABASE_URL: postgres://wallet_app:wallet_app@postgres:5432/wagering
      PROMETHEUS_URL: http://prometheus:9090
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./load:/app/load

volumes:
  postgres-data:
